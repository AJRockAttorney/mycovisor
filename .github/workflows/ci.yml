name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Ring buffer unit tests (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            -o test_ring_buff tests/test_ring_buff.c Core/Src/ring_buff.c
          ./test_ring_buff

  firmware:
    name: Firmware build (STM32U5, arm-none-eabi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.2.Rel1"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset Debug

      - name: Build
        run: cmake --build --preset Debug

  static-analysis:
    name: cppcheck (Core/Src)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr --std=c11 -ICore/Inc -DMPACK_HAS_CONFIG=1 \
            --suppress=missingIncludeSystem \
            Core/Src/app.c Core/Src/lpuart.c Core/Src/ring_buff.c Core/Src/rpc.c \
            Core/Src/fault.c
