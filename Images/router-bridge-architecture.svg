<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-label="Arduino Router Bridge architecture between MPU and MCU">
  <title>Arduino Router Bridge architecture between MPU and MCU</title>
  <desc>The MPU runs Linux clients and the arduino-router broker, which communicates over an internal UART using MessagePack-RPC across the chip boundary to the MCU. The MCU C stack layers from LPUART/GPDMA up through ring buffers, a MessagePack streaming parser, RPC dispatch and registration, and application handlers.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .th { font-weight: 500; font-size: 14px; }
    .ts { font-weight: 400; font-size: 12px; }
    .container   { fill: none; stroke: #888780; stroke-width: 0.75; }
    .box-gray    { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; }
    .box-teal    { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .box-purple  { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
    .t-primary   { fill: #2C2C2A; }
    .t-sub       { fill: #5F5E5A; }
    .t-teal      { fill: #085041; }
    .t-teal-sub  { fill: #0F6E56; }
    .t-purple    { fill: #3C3489; }
    .t-purple-sub{ fill: #534AB7; }
    .arr         { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .arrhead     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider     { stroke: #888780; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .container   { stroke: #B4B2A9; }
      .box-gray    { fill: #2C2C2A; stroke: #B4B2A9; }
      .box-teal    { fill: #04342C; stroke: #5DCAA5; }
      .box-purple  { fill: #26215C; stroke: #AFA9EC; }
      .t-primary   { fill: #E8E6DE; }
      .t-sub       { fill: #B4B2A9; }
      .t-teal      { fill: #9FE1CB; }
      .t-teal-sub  { fill: #5DCAA5; }
      .t-purple    { fill: #CECBF6; }
      .t-purple-sub{ fill: #AFA9EC; }
      .arr         { stroke: #B4B2A9; }
      .arrhead     { stroke: #B4B2A9; }
      .divider     { stroke: #9C9A92; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrhead" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="container" x="60" y="40" width="560" height="96" rx="16"/>
  <text class="th t-primary" x="84" y="62">MPU — QRB2210 · Debian Linux</text>

  <rect class="box-gray" x="84" y="78" width="200" height="44" rx="8"/>
  <text class="th t-primary" x="184" y="94" text-anchor="middle" dominant-baseline="central">Linux clients</text>
  <text class="ts t-sub" x="184" y="110" text-anchor="middle" dominant-baseline="central">Python · custom apps</text>

  <rect class="box-teal" x="320" y="78" width="276" height="44" rx="8"/>
  <text class="th t-teal" x="458" y="94" text-anchor="middle" dominant-baseline="central">arduino-router</text>
  <text class="ts t-teal-sub" x="458" y="110" text-anchor="middle" dominant-baseline="central">broker · msgid remap + forwarding</text>

  <line x1="284" y1="100" x2="318" y2="100" class="arr"  marker-end="url(#arrow)"/>

  <line x1="340" y1="136" x2="340" y2="198" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="ts t-sub" x="356" y="150" text-anchor="start">internal UART (ttyHS1 ⇄ Serial1)</text>
  <text class="ts t-sub" x="356" y="166" text-anchor="start">MessagePack-RPC · byte stream</text>

  <line class="divider" x1="60" y1="175" x2="620" y2="175"/>
  <line class="divider" x1="60" y1="181" x2="620" y2="181"/>

  <rect class="container" x="60" y="200" width="560" height="300" rx="16"/>
  <text class="th t-primary" x="84" y="222">MCU — STM32U585 · bare-metal C stack</text>

  <rect class="box-gray" x="84" y="236" width="512" height="42" rx="8"/>
  <text class="th t-primary" x="340" y="252" text-anchor="middle" dominant-baseline="central">LPUART + GPDMA</text>
  <text class="ts t-sub" x="340" y="267" text-anchor="middle" dominant-baseline="central">RX/TX via DMA · idle-line + DMA-complete ISR</text>

  <rect class="box-gray" x="84" y="288" width="512" height="42" rx="8"/>
  <text class="th t-primary" x="340" y="304" text-anchor="middle" dominant-baseline="central">RX / TX ring buffers</text>
  <text class="ts t-sub" x="340" y="319" text-anchor="middle" dominant-baseline="central">decouple ISR context from processing · absorb bursts</text>

  <rect class="box-purple" x="84" y="340" width="512" height="42" rx="8"/>
  <text class="th t-purple" x="340" y="356" text-anchor="middle" dominant-baseline="central">MessagePack streaming parser (MPack)</text>
  <text class="ts t-purple-sub" x="340" y="371" text-anchor="middle" dominant-baseline="central">reassembles complete RPC messages across chunk boundaries</text>

  <rect class="box-purple" x="84" y="392" width="512" height="42" rx="8"/>
  <text class="th t-purple" x="340" y="408" text-anchor="middle" dominant-baseline="central">RPC dispatch + registration</text>
  <text class="ts t-purple-sub" x="340" y="423" text-anchor="middle" dominant-baseline="central">$/register on connect · [0] request  [1] response  [2] notify</text>

  <rect class="box-teal" x="84" y="444" width="512" height="42" rx="8"/>
  <text class="th t-teal" x="340" y="460" text-anchor="middle" dominant-baseline="central">Application handlers</text>
  <text class="ts t-teal-sub" x="340" y="475" text-anchor="middle" dominant-baseline="central">set_led, read_sensor, … — registered procedures</text>
</svg>
